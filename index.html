<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>价目表生成器</title>
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="history-actions">
        <button class="icon-button top-undo" id="undoButton" type="button" aria-label="撤销上一步" disabled><span class="fontello-icon">&#xe807;</span></button>
        <button class="icon-button top-redo" id="redoButton" type="button" aria-label="重做刚撤销的操作" disabled><span class="fontello-icon">&#xe808;</span></button>
      </div>
      <div class="top-title">
        <p class="eyebrow">PRICE NOTE</p>
        <h1>价目表生成器</h1>
      </div>
      <button class="icon-button top-preview" id="previewButton" type="button">
        <span>导出</span>
      </button>
    </header>

    <main class="workspace" id="workspace">
      <section class="receipt-wrap" aria-label="价目表预览">
        <div class="receipt-pages" id="receiptCanvas"><div id="blockList"></div></div>
        <button class="add-page-button" id="addPageButton" type="button" aria-label="增加单独一页"><span class="fontello-icon">&#xe800;</span><span>增加一页</span></button>
        <p class="canvas-tip">点选编辑 · 长按排序 · 从“添加”拖入模块</p>
      </section>
    </main>

    <nav class="bottom-bar" aria-label="编辑工具">
      <button class="tool-tab" type="button" data-panel="templates">
        <span class="tool-icon fontello-icon">&#xe801;</span><span>模板</span>
      </button>
      <button class="tool-tab tool-tab-primary" type="button" data-panel="add">
        <span class="tool-icon fontello-icon">&#xe800;</span><span>添加</span>
      </button>
      <button class="tool-tab" type="button" data-panel="structure">
        <span class="tool-icon fontello-icon">&#xe809;</span><span>结构</span>
      </button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editorSheet" aria-hidden="true">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div>
        <p class="eyebrow" id="sheetEyebrow">EDIT</p>
        <h2 id="sheetTitle">编辑模块</h2>
      </div>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="关闭">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="app-modal-backdrop" id="templateConfirmModal" aria-hidden="true">
    <section class="app-modal" role="alertdialog" aria-modal="true" aria-labelledby="templateConfirmTitle" aria-describedby="templateConfirmText">
      <p class="eyebrow">REPLACE TEMPLATE</p>
      <h2 id="templateConfirmTitle">确定重选模板吗？</h2>
      <p id="templateConfirmText">当前价目表已经修改过，重选后现有内容会被替换。</p>
      <div class="app-modal-actions">
        <button class="secondary-button modal-button" id="templateConfirmCancel" type="button">取消</button>
        <button class="export-button modal-button" id="templateConfirmAccept" type="button">确定替换</button>
      </div>
    </section>
  </div>

  <input id="imagePicker" class="visually-hidden" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
  <input id="fontPicker" class="visually-hidden" type="file" accept=".woff,.woff2,.ttf,.otf,font/woff,font/woff2,font/ttf,font/otf">
  <section class="preview-page" id="previewPage" aria-hidden="true">
    <header class="preview-head">
      <button class="preview-back" id="previewBack" type="button" aria-label="返回编辑" title="返回编辑">←</button>
      <div>
        <p class="eyebrow">PREVIEW</p>
        <h2>确认导出效果</h2>
      </div>
      <span class="preview-spacer"></span>
    </header>
    <div class="preview-options">
      <div class="segmented preview-segmented">
        <button class="segment active" type="button" data-export-mode="long">完整长图</button>
        <button class="segment" type="button" data-export-mode="split">3:4 切分</button>
        <button class="segment" type="button" data-export-mode="tool">小红书组件</button>
      </div>
      <p class="preview-note" id="previewNote">生成一张完整的高清长图</p>
    </div>
    <main class="preview-list" id="previewList"></main>
    <footer class="preview-footer">
      <button class="export-button" id="exportButton" type="button" disabled>保存长图到相册</button>
    </footer>
  </section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./assets/app.js"></script>
</body>
</html>
